project_name: STANet
seed: 42
device: cuda

dataset:
  file_name: graph_data.json
  time_step: 7
  train_ratio: 0.8

model:
  embedding_dim: 32
  attention:
    name: 'standard'  # 'standard' or 'differential'
  POIEncoder:
    num_poi_categories: 3
    activate: true
  StaticRegionEncoder:
    activate: true
    output_dim: 32
  TemporalContextEncoder:
    embedding_dim: 16
    weather_input_dim: 4
  DynamicDemandEncoder:
    embedding_dim: 17
    demand_embedding_dim: 8
    delta_max: 24
  SnapshotGlobalAttention:
    nhead: 4
    use_od_bias: true
    od_eps: 1e-6
    lambda_od_init: -2.0
  TemporalStateUpdater:
    GRU_configs:
      num_layers: 2
      dropout: 0.3
  TemporalWindowAggregator: {}
  PTReLU:
    alpha: 0.7
    n: 5.0

loss:
  lambda_mag: 0.8
  gamma: 1.0
  eps: 1.0
  reduction: mean

train:
  output_dir: output/STANet
  per_device_train_batch_size: 30
  per_device_eval_batch_size: 500
  num_train_epochs: 60
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  optim: adamw_torch
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 500
  eval_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: loss
  greater_is_better: false

callbacks:
  early_stopping:
    min_epochs: 20
    early_stopping_patience: 3
    early_stopping_threshold: 0.0
